# golangci-lint configuration
version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - revive
    - gosec
    - unconvert
    - prealloc
  disable:
    - funlen
    - gocognit

issues:
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports